<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <title>Clean FH4 Sport Analog Speedometer JG:VRP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container di pojok kanan bawah persis seperti FiveM gameplay */
    #speedo-container {
      position: fixed;
      bottom: 24px;
      right: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      z-index: 1000;
      pointer-events: none;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.85));
      /* Animasi transisi Engine ON (fade in dari bawah) & Engine OFF (fade out turun ke bawah) */
      opacity: 0;
      transform: translateY(120px) scale(0.95);
      visibility: hidden;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s;
    }

    #speedo-container.engine-on {
      opacity: 1;
      transform: translateY(0) scale(1);
      visibility: visible;
    }

    /* Left Cluster: Rev Bar, Gear, Speed, Indicator Lamps, Health & Fuel */
    .left-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-right: -26px;
      z-index: 20;
      padding-bottom: 8px;
    }

    .rev-bar-track {
      width: 110px;
      height: 6px;
      background: rgba(15, 23, 42, 0.85);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      margin-bottom: 6px;
      display: flex;
      justify-content: flex-end;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .rev-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(to right, #00d2ff, #ffaa00);
      border-radius: 999px;
      transition: width 0.05s ease-out;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
    }

    .gear-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      text-shadow: 0 0 16px rgba(255, 102, 0, 0.6);
    }

    .gear-text {
      font-size: 54px;
      font-weight: 900;
      font-family: monospace;
      color: #ff9900;
      line-height: 1;
      letter-spacing: -2px;
    }

    .gear-mode {
      font-size: 14px;
      font-weight: 900;
      color: #f1f5f9;
      letter-spacing: 1px;
    }

    .speed-number {
      font-size: 78px;
      font-weight: 900;
      color: #ffffff;
      font-family: monospace;
      line-height: 0.95;
      letter-spacing: -4px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 255, 255, 0.25);
    }

    .speed-unit {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 1px;
      margin-right: 4px;
      text-transform: lowercase;
    }

    .indicator-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .ind-icon {
      width: 18px;
      height: 18px;
      opacity: 0.2;
      transition: all 0.15s ease;
      fill: currentColor;
      color: #94a3b8;
    }

    .ind-icon.active {
      opacity: 1;
    }

    .ind-icon.headlight.active {
      color: #34d399;
      filter: drop-shadow(0 0 8px #34d399);
    }

    .ind-icon.headlight.high-beam {
      color: #3b82f6;
      filter: drop-shadow(0 0 10px #3b82f6);
    }

    .ind-icon.seatbelt.active {
      color: #ef4444;
      filter: drop-shadow(0 0 8px #ef4444);
      animation: pulse 1s infinite;
    }

    .ind-icon.handbrake.active {
      color: #ef4444;
      filter: drop-shadow(0 0 8px #ef4444);
    }

    .ind-icon.signal.active {
      color: #34d399;
      filter: drop-shadow(0 0 10px #34d399);
    }

    .ind-icon.engine.active {
      color: #f59e0b;
      filter: drop-shadow(0 0 8px #f59e0b);
    }

    /* Mini Status Bars (Health Mobil & Bensin Mobil) */
    .status-bars-panel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 64px;
    }

    .status-label-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }

    .status-mini-icon {
      width: 13px;
      height: 13px;
      color: #94a3b8;
      transition: color 0.2s ease;
      fill: currentColor;
    }

    .status-mini-icon.health-icon {
      color: #34d399;
      filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.6));
    }

    .status-mini-icon.fuel-icon {
      color: #ff9900;
      filter: drop-shadow(0 0 6px rgba(255, 153, 0, 0.6));
    }

    .status-pct {
      font-size: 9px;
      font-family: monospace;
      font-weight: 700;
      color: #cbd5e1;
    }

    .status-track {
      width: 100%;
      height: 5px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .status-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease-out, background-color 0.3s ease;
    }

    .status-fill.health-bar {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .status-fill.fuel-bar {
      background: #ff9900;
      box-shadow: 0 0 8px #ff9900;
    }

    /* Right Cluster: Circular Tachometer */
    .tachometer-dial {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.98) 100%);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.25), inset 0 0 30px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tach-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .tach-center-text {
      position: absolute;
      top: 36%;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .tach-center-text .rpm-title {
      font-size: 13px;
      font-weight: 900;
      color: #ff9900;
      letter-spacing: 2px;
    }

    .tach-center-text .rpm-sub {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
    }

    .needle-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s linear;
      pointer-events: none;
    }

    .needle-blade {
      width: 5px;
      height: 110px;
      transform: translateY(-55px);
      border-radius: 999px;
      background: linear-gradient(to top, transparent 10%, #ff3b30 60%, #ffffff 100%);
      box-shadow: 0 0 14px #ff3b30;
    }

    .needle-cap {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #334155 0%, #020617 100%);
      border: 2px solid #64748b;
      box-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 20;
    }

    .needle-cap::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: #ff3b30;
      border-radius: 50%;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Speedometer Display (Bottom Right) -->
  <div id="speedo-container">

        <circle cx="0" cy="0" r="112" fill="none" stroke="#ff6600" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="360 200" transform="rotate(135)" />
        <!-- Redline Arc (7 to 9) -->
        <circle cx="0" cy="0" r="112" fill="none" stroke="#ef4444" stroke-opacity="0.95" stroke-width="4.5" stroke-dasharray="80 400" transform="rotate(75)" />

        <!-- Ticks & Numbers (0 to 9) -->
        <g id="tach-ticks"></g>
      </svg>

  <script>
    // --- Render Ticks SVG (0 to 9) ---
    const ticksGroup = document.getElementById('tach-ticks');
    const totalUnits = 9;
    const subSteps = 4;
    for (let i = 0; i <= totalUnits * subSteps; i++) {
      const val = i / subSteps;
      const angle = -135 + (val / totalUnits) * 270;
      const isMajor = i % subSteps === 0;
      const isRedline = val >= 7.0;

      const rad = ((angle - 90) * Math.PI) / 180;
      const rOuter = 114;
      const rInner = isMajor ? 99 : 106;
      const rText = 85;

      const x1 = Math.cos(rad) * rOuter;
      const y1 = Math.sin(rad) * rOuter;
      const x2 = Math.cos(rad) * rInner;
      const y2 = Math.sin(rad) * rInner;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1);
      line.setAttribute('y1', y1);
      line.setAttribute('x2', x2);
      line.setAttribute('y2', y2);
      line.setAttribute('stroke', isRedline ? '#ef4444' : isMajor ? '#ff9900' : '#64748b');
      line.setAttribute('stroke-width', isMajor ? '2.5' : '1.2');
      line.setAttribute('stroke-opacity', isMajor ? '0.95' : '0.5');
      ticksGroup.appendChild(line);

      if (isMajor) {
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', Math.cos(rad) * rText);
        text.setAttribute('y', Math.sin(rad) * rText);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('font-size', '14');
        text.setAttribute('font-weight', '900');
        text.setAttribute('fill', isRedline ? '#ef4444' : '#f8fafc');
        text.textContent = Math.round(val);
        ticksGroup.appendChild(text);
      }
    }

    // --- State & DOM References ---
    const elSpeedoContainer = document.getElementById('speedo-container');
    const elSpeed = document.getElementById('speed-display');
    const elGear = document.getElementById('gear-display');
    const elRevBar = document.getElementById('rev-bar');
    const elNeedle = document.getElementById('needle-rotator');
    const elUnitLabel = document.getElementById('unit-label');
    const elIconSeatbelt = document.getElementById('icon-seatbelt');
    const elIconHandbrake = document.getElementById('icon-handbrake');
    const elIconEngine = document.getElementById('icon-engine');
    const elIconLight = document.getElementById('icon-light');
    const elIconSigL = document.getElementById('icon-signal-l');
    const elIconSigR = document.getElementById('icon-signal-r');
    const elHealthBar = document.getElementById('health-bar');
    const elHealthPct = document.getElementById('health-pct');
    const elHealthIcon = document.getElementById('health-icon');
    const elFuelBar = document.getElementById('fuel-bar');
    const elFuelPct = document.getElementById('fuel-pct');
    const elFuelIcon = document.getElementById('fuel-icon');

    let currentSpeedMode = 0; // 0: KMH, 1: MPH, 2: Knots
    let isSeatbeltFastened = false;
    let isEngineRunning = false;
    let hasEngineInitialSync = false; // Mencegah bunyi engine on/off saat baru masuk mobil
    let currentSpeedKmh = 0;
    let seatbeltVoicePlayed = false;
    let seatbeltChimeTimer = null;
    let turnSignalTimer = null;

    // --- Web Audio Synthesizer (Zero Delay & Offline) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    const AUDIO_CANDIDATES = {
      engineOn: [
        'engine on.mp3',
        'engine_on.mp3',
        'engine-on.mp3',
        'engineon.mp3',
        'audio/engine on.mp3',

        'Bep bep seatbelt.mp3',

      ],
    };

    const cachedAudioElements = {};

    function playAudio(type, fallbackFn) {
      // 1. Cek Custom Audio Base64 (jika sudah di-embed langsung di file)
      if (CUSTOM_AUDIO[type]) {
        try {
          const a = new Audio(CUSTOM_AUDIO[type]);
          a.volume = 0.95;
          const p = a.play();
          if (p !== undefined) {
            p.catch(() => { if (fallbackFn) fallbackFn(); });
          }
          return;
        } catch (e) {
          if (fallbackFn) fallbackFn();
          return;
        }
      }

      // 2. Cek apakah sudah pernah berhasil memuat elemen audio dari kandidat
      if (cachedAudioElements[type]) {
        try {
          const a = cachedAudioElements[type];
          a.currentTime = 0;
          const p = a.play();
          if (p !== undefined) {
            p.catch(() => { if (fallbackFn) fallbackFn(); });
          }
          return;
        } catch (e) {}
      }

      // 3. Cari berurutan di folder GitHub / hosting yang sama
      const candidates = AUDIO_CANDIDATES[type] || [];
      let idx = 0;

      function tryNextCandidate() {
        if (idx >= candidates.length) {
          if (fallbackFn) fallbackFn();
          return;
        }

        const candidateSrc = candidates[idx++];
        const audio = new Audio(candidateSrc);
        audio.volume = 0.95;
        let isStarted = false;

        audio.addEventListener('error', () => {
          if (!isStarted) tryNextCandidate();
        });

        try {
          const p = audio.play();
          if (p !== undefined) {
            p.then(() => {
              isStarted = true;
              cachedAudioElements[type] = audio;
            }).catch(() => {
              if (!isStarted) tryNextCandidate();
            });
          } else {
            cachedAudioElements[type] = audio;
          }
        } catch (err) {
          tryNextCandidate();
        }
      }

      tryNextCandidate();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 0.98;
          u.pitch = 0.85;
          window.speechSynthesis.speak(u);
        } catch (e) {}
      }
    }

    function playSynthesizedDing() {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const playTone = (t, freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.45);
        };
        playTone(now, 784); // G5 Bell 1
        playTone(now + 0.2, 659); // E5 Bell 2
      } catch (e) {}
    }

    function playDoubleDing() {
      playAudio('seatbeltChime', playSynthesizedDing);
    }

    function playRelayClick() {
      const ctx = getAudioContext();
      if (!ctx) return;
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1100, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function monitorSeatbelt(speed, fastened, engine) {
      if (!engine || fastened) {
        if (seatbeltChimeTimer) {
          clearInterval(seatbeltChimeTimer);
          seatbeltChimeTimer = null;
        }
        if (fastened) seatbeltVoicePlayed = false;
        elIconSeatbelt.classList.remove('active');
        return;
      }

      elIconSeatbelt.classList.add('active');

      if (speed >= 5) {
        if (!seatbeltVoicePlayed) {
          seatbeltVoicePlayed = true;
          playAudio('seatbeltVoice', () => speak('Please fasten your seatbelt for your safety.'));
          setTimeout(() => {
            if (!isSeatbeltFastened && !seatbeltChimeTimer) {
              playDoubleDing();
              seatbeltChimeTimer = setInterval(playDoubleDing, 1600);
            }
          }, 2400);
        } else if (!seatbeltChimeTimer) {
          playDoubleDing();
          seatbeltChimeTimer = setInterval(playDoubleDing, 1600);
        }
      } else if (speed < 3 && seatbeltChimeTimer) {
        clearInterval(seatbeltChimeTimer);
        seatbeltChimeTimer = null;
      }
    }

    /**
     * Mengatur satuan kecepatan (0: KMH, 1: MPH, 2: Knots)
     */
    function setSpeedMode(mode) {
      currentSpeedMode = Number(mode) || 0;
      if (currentSpeedMode === 1) {
        elUnitLabel.innerText = 'mph';
      } else if (currentSpeedMode === 2) {
        elUnitLabel.innerText = 'knots';
      } else {
        elUnitLabel.innerText = 'km/h';
      }
    }

    /**
     * Menerima kecepatan m/s dari game FiveM GTA V
     */
    function setSpeed(speed) {
      const s = Number(speed) || 0;
      let finalSpeed = 0;
      if (currentSpeedMode === 1) {
        finalSpeed = Math.round(s * 2.236936); // MPH
      } else if (currentSpeedMode === 2) {
        finalSpeed = Math.round(s * 1.943844); // Knots
      } else {
        finalSpeed = Math.round(s * 3.6); // KM/H
      }

      currentSpeedKmh = finalSpeed;
      elSpeed.textContent = finalSpeed;

      monitorSeatbelt(currentSpeedKmh, isSeatbeltFastened, isEngineRunning);
    }

    /**
     * Mengatur putaran mesin / RPM (Menerima 0.0 s/d 1.0 dari FiveM)
     */
    function setRPM(rpm) {
      const val = Number(rpm) || 0;
      // FiveM mengirimkan RPM bernilai 0.0 sampai 1.0
      const rpmFraction = val > 1.0 ? val / 9000 : val;
      const clampedFraction = Math.max(0, Math.min(1.0, rpmFraction));

      // Putar jarum tachometer (-135deg pada 0 s/d +135deg pada 9000)
      const angle = -135 + clampedFraction * 270;
      elNeedle.style.transform = `rotate(${angle}deg)`;

      // Update horizontal rev bar
      const widthPct = Math.max(8, clampedFraction * 100);
      elRevBar.style.width = widthPct + '%';
    }

    /**
     * Mengatur gear transmisi (0: R, 1, 2, 3, 4, 5, 6, N)
     */
    function setGear(gear) {
      if (gear === 0 || gear === '0' || gear === 'R') {
        elGear.innerText = 'R';
        elGear.style.color = '#ef4444';
      } else if (gear === 'N' || gear === 'P') {
        elGear.innerText = String(gear);
        elGear.style.color = '#94a3b8';
      } else {
        const num = Number(gear);
        elGear.innerText = isNaN(num) ? String(gear) : String(num);
        elGear.style.color = '#ff9900';
      }
    }

    /**
     * Mengatur status mesin (true: menyala, false: mati)
     */
    function setEngine(state) {
      const isRunning = Boolean(state);

      // Sinkronisasi pertama kali (saat web dimuat atau baru masuk ke dalam mobil):
      // Jangan putar suara engine on/off, hanya perbarui tampilan UI & animasi!
      if (!hasEngineInitialSync) {
        hasEngineInitialSync = true;
        isEngineRunning = isRunning;
        updateEngineStateUI(isEngineRunning);
        return;
      }

      // Jika ada perubahan nyata (misal saat player menyalakan / mematikan mesin mobil):
      if (isRunning !== isEngineRunning) {
        isEngineRunning = isRunning;
        updateEngineStateUI(isEngineRunning);

        if (isEngineRunning) {
          playAudio('engineOn', () => speak('Engine on.'));
        } else {
          playAudio('engineOff', () => speak('Engine off.'));
        }
      }
    }

    /**
     * Memperbarui tampilan UI & Animasi Engine ON / OFF
     * Saat Engine ON: Animasi fade in & slide up dari bawah ke posisi normal
     * Saat Engine OFF: Animasi fade out & slide down ke bawah lalu menghilang
     */
    function updateEngineStateUI(running) {
      if (running) {
        if (elSpeedoContainer) elSpeedoContainer.classList.add('engine-on');
        if (elIconEngine) elIconEngine.classList.remove('active');
      } else {
        if (elSpeedoContainer) elSpeedoContainer.classList.remove('engine-on');
        if (elIconEngine) elIconEngine.classList.add('active');
        // Reset jarum & rpm saat mesin mati
        setRPM(0);
        setSpeed(0);
      }
    }

    /**
     * Mengatur sabuk pengaman (true: terpasang, false: dilepas)
     */
    function setSeatbelts(state) {
      isSeatbeltFastened = Boolean(state);
      monitorSeatbelt(currentSpeedKmh, isSeatbeltFastened, isEngineRunning);
    }

    /**
     * Mengatur lampu (0: Mati, 1: Lampu Dekat Hijau, 2: Lampu Jauh Biru)
     */
    function setHeadlights(state) {
      const mode = Number(state) || 0;
      elIconLight.classList.remove('active', 'high-beam');
      if (mode === 2) {
        elIconLight.classList.add('active', 'high-beam');
      } else if (mode > 0) {
        elIconLight.classList.add('active');
      }
    }

    /**
     * Mengatur rem tangan / Handbrake
     */
    function setHandbrake(state) {
      if (state) elIconHandbrake.classList.add('active');
      else elIconHandbrake.classList.remove('active');
    }

    /**
     * Indikator Lampu Sein Kiri
     */
    function setLeftIndicator(state) {
      if (state) {
        elIconSigL.classList.add('active');
        playRelayClick();
      } else {
        elIconSigL.classList.remove('active');
      }
    }

    /**
     * Indikator Lampu Sein Kanan
     */
    function setRightIndicator(state) {
      if (state) {
        elIconSigR.classList.add('active');
        playRelayClick();
      } else {
        elIconSigR.classList.remove('active');
      }
    }

    /**
     * Mengatur level bensin mobil (0 - 100% atau 0.0 - 1.0)
     */
    function setFuel(fuel) {
      let val = Number(fuel);
      if (isNaN(val)) val = 100;
      if (val > 0 && val <= 1.0) val = val * 100;
      const pct = Math.max(0, Math.min(100, Math.round(val)));

      if (elFuelBar) {
        elFuelBar.style.width = pct + '%';
        if (pct <= 20) {
          elFuelBar.style.background = '#ef4444';
          elFuelBar.style.boxShadow = '0 0 8px #ef4444';
          if (elFuelIcon) elFuelIcon.style.color = '#ef4444';
        } else {
          elFuelBar.style.background = '#ff9900';
          elFuelBar.style.boxShadow = '0 0 8px #ff9900';
          if (elFuelIcon) elFuelIcon.style.color = '#ff9900';
        }
      }
      if (elFuelPct) elFuelPct.innerText = pct + '%';
    }

    /**
     * Mengatur health / kondisi mobil (0 - 1000 skala GTA V atau 0 - 100%)
     */
    function setHealth(health) {
      let val = Number(health);
      if (isNaN(val)) val = 100;
      if (val > 100) val = val / 10;
      const pct = Math.max(0, Math.min(100, Math.round(val)));

      if (elHealthBar) {
        elHealthBar.style.width = pct + '%';
        if (pct <= 25) {
          elHealthBar.style.background = '#ef4444';
          elHealthBar.style.boxShadow = '0 0 8px #ef4444';
          if (elHealthIcon) elHealthIcon.style.color = '#ef4444';
        } else if (pct <= 55) {
          elHealthBar.style.background = '#f59e0b';
          elHealthBar.style.boxShadow = '0 0 8px #f59e0b';
          if (elHealthIcon) elHealthIcon.style.color = '#f59e0b';
        } else {
          elHealthBar.style.background = '#10b981';
          elHealthBar.style.boxShadow = '0 0 8px #10b981';
          if (elHealthIcon) elHealthIcon.style.color = '#34d399';
        }
      }
      if (elHealthPct) elHealthPct.innerText = pct + '%';
    }

    function setOdometer(dist) {}

    // Expose semua fungsi global ke window agar script client JG:VRP FiveM bisa memanggil langsung
    window.setSpeedMode = setSpeedMode;
    window.setSpeed = setSpeed;
    window.setRPM = setRPM;
    window.setFuel = setFuel;
    window.setHealth = setHealth;
    window.setVehicleHealth = setHealth;
    window.setEngineHealth = setHealth;
    window.setGear = setGear;
    window.setEngine = setEngine;
    window.setHeadlights = setHeadlights;
    window.setLeftIndicator = setLeftIndicator;
    window.setRightIndicator = setRightIndicator;
    window.setSeatbelts = setSeatbelts;
    window.setOdometer = setOdometer;
    window.setHandbrake = setHandbrake;
    window.setHandBrake = setHandbrake;

    // --- Dukungan FiveM SendNUIMessage Events ---
    window.addEventListener('message', function(event) {
      const d = event.data;
      if (!d) return;

      // Saat player keluar dari mobil di FiveM: sembunyikan speedo dan reset status sync
      if (d.inVehicle === false || d.show === false || d.action === 'hide') {
        hasEngineInitialSync = false;
        if (elSpeedoContainer) elSpeedoContainer.classList.remove('engine-on');
        return;
      }

      // Saat player baru masuk ke mobil di FiveM: reset flag agar sync awal tidak mengeluarkan suara
      if (d.inVehicle === true || d.show === true || d.action === 'show') {
        hasEngineInitialSync = false;
      }

      if (d.speed !== undefined) setSpeed(d.speed);
      if (d.rpm !== undefined) setRPM(d.rpm);
      if (d.gear !== undefined) setGear(d.gear);
      if (d.engineRunning !== undefined) setEngine(d.engineRunning);
      if (d.engine !== undefined) setEngine(d.engine);
      if (d.seatbelt !== undefined) setSeatbelts(d.seatbelt);
      if (d.handbrake !== undefined) setHandbrake(d.handbrake);
      if (d.light !== undefined) setHeadlights(d.light);
      if (d.leftSignal !== undefined) setLeftIndicator(d.leftSignal);
      if (d.rightSignal !== undefined) setRightIndicator(d.rightSignal);
      if (d.speedMode !== undefined) setSpeedMode(d.speedMode);

      // Sinkronisasi Health Mobil & Bensin
      if (d.fuel !== undefined) setFuel(d.fuel);
      if (d.health !== undefined) setHealth(d.health);
      if (d.vehicleHealth !== undefined) setHealth(d.vehicleHealth);
      if (d.engineHealth !== undefined) setHealth(d.engineHealth);
    });

    // Inisialisasi awal (Sync diam tanpa memutar suara engine on saat pertama kali dibuka)
    setSpeedMode(0);
    setGear(1);
    setFuel(85);
    setHealth(100);
    setEngine(true);
    setSeatbelts(false);
  </script>
</body>
</html>
